services:
  # Nginx web server
  web:
    container_name: ${COMPOSE_PROJECT_NAME:-craftcms}-web
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - craft

  # PHP-FPM service
  php:
    container_name: ${COMPOSE_PROJECT_NAME:-craftcms}-php
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html
    environment:
      # Database connection
      DB_DRIVER: mysql
      DB_SERVER: db
      DB_PORT: 3306
      DB_DATABASE: ${CRAFT_DB_DATABASE}
      DB_USER: ${CRAFT_DB_USER}
      DB_PASSWORD: ${CRAFT_DB_PASSWORD}
      DB_SCHEMA: ${CRAFT_DB_SCHEMA}
      DB_TABLE_PREFIX: ${CRAFT_DB_TABLE_PREFIX}
      
      # Craft environment
      CRAFT_ENVIRONMENT: dev
      CRAFT_SECURITY_KEY: ${CRAFT_SECURITY_KEY}
      CRAFT_APP_ID: ${CRAFT_APP_ID}
      
      # Primary site URL
      PRIMARY_SITE_URL: ${PRIMARY_SITE_URL}

      # SMTP settings
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      - db
      - redis
    networks:
      - craft

  # MySQL database
  db:
    container_name: ${COMPOSE_PROJECT_NAME:-craftcms}-db
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${CRAFT_DB_DATABASE}
      MYSQL_USER: ${CRAFT_DB_USER}
      MYSQL_PASSWORD: ${CRAFT_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - craft

  # Redis for caching and sessions
  redis:
    container_name: ${COMPOSE_PROJECT_NAME:-craftcms}-redis
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - craft

  # phpMyAdmin for database management (optional)
  phpmyadmin:
    container_name: ${COMPOSE_PROJECT_NAME:-craftcms}-phpmyadmin
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: craft
      PMA_PASSWORD: craft
    depends_on:
      - db
    networks:
      - craft

networks:
  craft:
    driver: bridge

volumes:
  db_data: