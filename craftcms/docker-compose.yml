services:
  # Nginx web server
  web:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./craftcms:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - craft

  # PHP-FPM service
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html
    environment:
      # Database connection
      DB_DRIVER: mysql
      DB_SERVER: db
      DB_PORT: 3306
      DB_DATABASE: craft
      DB_USER: craft
      DB_PASSWORD: craft
      DB_SCHEMA: public
      DB_TABLE_PREFIX: ""
      
      # Craft environment
      CRAFT_ENVIRONMENT: dev
      CRAFT_SECURITY_KEY: ${CRAFT_SECURITY_KEY}
      CRAFT_APP_ID: ${CRAFT_APP_ID}
      
      # Primary site URL
      PRIMARY_SITE_URL: http://localhost:8000
    depends_on:
      - db
      - redis
    networks:
      - craft

  # MySQL database
  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - craft

  # Redis for caching and sessions
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - craft

  # phpMyAdmin for database management (optional)
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: craft
      PMA_PASSWORD: craft
    depends_on:
      - db
    networks:
      - craft

networks:
  craft:
    driver: bridge

volumes:
  db_data: